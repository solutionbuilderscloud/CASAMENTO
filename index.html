<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chá de Panela da Zeinab</title>
<meta name="description" content="Lista de regalos del Chá de Panela de Zeinab.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e6e2;
    --card: #ffffff;
    --gold: #8a7552;
    --price: #8b6b4e;
    --text: #4a4038;
    --muted: #8f857b;
    --line: rgba(138, 117, 82, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* Fondo con rayos art déco, como en la referencia */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      linear-gradient(115deg, transparent 49.6%, var(--line) 49.8%, var(--line) 50.2%, transparent 50.4%) 0 100% / 50% 60% no-repeat,
      linear-gradient(65deg, transparent 49.6%, var(--line) 49.8%, var(--line) 50.2%, transparent 50.4%) 100% 100% / 50% 60% no-repeat;
  }

  .hero {
    text-align: center;
    padding: 40px 16px 28px;
  }
  .ornament { width: 210px; max-width: 60vw; color: var(--gold); margin: 0 auto 16px; display: block; }
  .hero h1 {
    font-family: "Italiana", serif;
    font-weight: 400;
    color: var(--gold);
    font-size: clamp(2.6rem, 8vw, 5.6rem);
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .hero h1 span { display: block; }
  .kicker {
    margin-top: 12px;
    color: var(--gold);
    font-weight: 600;
    font-size: clamp(0.85rem, 2.4vw, 1.15rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    padding-left: 0.55em;
  }
  .hero p.lead {
    max-width: 34rem; margin: 14px auto 0;
    color: var(--muted); font-size: 1rem;
  }
  .btn {
    display: inline-block; margin-top: 18px;
    padding: 12px 30px; border-radius: 999px;
    background: var(--gold); color: #fff; text-decoration: none;
    font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; font-size: 0.8rem;
    transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--price); transform: translateY(-2px); }

  .section-head { text-align: center; padding: 8px 16px 24px; }
  .section-head h2 {
    font-family: "Italiana", serif; font-weight: 400; color: var(--gold);
    font-size: clamp(2rem, 5.5vw, 3.4rem); text-transform: uppercase;
  }
  .section-head .kicker { margin-top: 6px; }

  .grid {
    max-width: 1240px; margin: 0 auto; padding: 0 16px 80px;
    display: grid; gap: 28px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--card);
    border-radius: 26px;
    padding: 18px 18px 22px;
    box-shadow: 0 10px 30px rgba(74, 64, 56, 0.07);
    transition: transform .25s, box-shadow .25s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(74, 64, 56, 0.12); }
  .card img {
    width: 100%; height: auto; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    background: var(--bg);
    color: transparent; /* oculta el texto alternativo mientras carga la foto */
  }
  .card h3 {
    margin-top: 18px;
    font-weight: 400; font-size: 0.88rem; text-transform: uppercase;
    letter-spacing: 0.02em; color: var(--text);
  }
  .card .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .price { color: var(--price); font-weight: 600; font-size: 1.15rem; }
  .code { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; }

  @media (max-width: 640px) {
    body::before { display: none; }
    .hero { padding: 28px 16px 20px; }
    .ornament { width: 150px; margin-bottom: 12px; }
    .hero h1 { font-size: 2.4rem; }
    .kicker { font-size: 0.75rem; letter-spacing: 0.4em; padding-left: 0.4em; }
    .hero p.lead { font-size: 0.85rem; margin-top: 10px; }
    .btn { margin-top: 14px; padding: 10px 24px; font-size: 0.72rem; }
    .section-head h2 { font-size: 1.7rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-bottom: 56px; }
    .card { border-radius: 16px; padding: 8px 8px 12px; }
    .card h3 { margin-top: 10px; font-size: 0.68rem; line-height: 1.35; }
    .card .meta { flex-direction: column; align-items: flex-start; gap: 2px; }
    .price { font-size: 0.95rem; }
    .code { font-size: 0.62rem; }
    .section-head { padding: 4px 16px 16px; }
  }

  footer {
    text-align: center; padding: 40px 16px 56px; color: var(--muted); font-size: 0.85rem;
  }
  footer .ornament { width: 120px; margin-bottom: 16px; }
  footer .logo { display: block; width: 160px; height: auto; margin: 28px auto 0; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="deco" viewBox="0 0 210 72" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <line x1="0" y1="70" x2="210" y2="70"/>
    <polygon points="105,2 93,26 105,62 117,26"/>
    <polyline points="93,26 105,36 117,26"/>
    <polygon points="78,14 64,32 98,62"/>
    <polygon points="132,14 146,32 112,62"/>
    <polyline points="50,40 40,52 90,62 50,40"/>
    <polyline points="160,40 170,52 120,62 160,40"/>
    <line x1="22" y1="62" x2="188" y2="62"/>
  </symbol>
</svg>

<header class="hero">
  <div>
    <svg class="ornament" viewBox="0 0 210 72"><use href="#deco"/></svg>
    <h1><span>Chá de Panela</span><span>da Zeinab</span></h1>
    <div class="kicker">Lista de regalos</div>
    <p class="lead">Elegí un regalo con cariño. Informá el código del producto al momento de la compra.</p>
    <a class="btn" href="#presentes">Ver regalos</a>
  </div>
</header>

<main id="presentes">
  <div class="section-head">
    <h2>Regalos</h2>
    <div class="kicker">Casa nueva</div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <svg class="ornament" viewBox="0 0 210 72"><use href="#deco"/></svg>
  <p>Con amor, Zeinab</p>
  <img class="logo" src="img/logo-magnific.png" alt="Magnific Decor" width="502" height="224">
</footer>

<script>
  // [código, nombre, precio] — precio null = a confirmar
  const productos = [
    ["263369", "Juego de 6 vasos de vidrio con borde dorado", 14.00],
    ["263365", "Jarra de vidrio acanalada", 12.00],
    ["061705", "Juego de tazas de cerámica 220 ml", 19.99],
    ["261441", "Juego de tazas 12 piezas con plato de bambú", null],
    ["262921", "Posaplato dorado 33 cm", 2.30],
    ["252810", "Plato principal de cerámica 27 cm", 5.80],
    ["252809", "Plato de postre de cerámica 20 cm", 3.10],
    ["252812", "Bowl de cerámica", 3.60],
    ["260062", "Juego de cubiertos inox 24 piezas Reali", 18.50],
    ["135117", "Juego de ollas antiadherentes 11 piezas Cuisinart", 175.00],
    ["285300", "Kit de utensilios inox 6 piezas Cuisinart", 54.00],
    ["600449", "Juego de 3 bandejas de cerámica", 29.99],
    ["253018", "Bandeja de cerámica 30×19×9 cm", 7.60],
    ["276900", "Juego de 2 asaderas de vidrio rectangulares", 18.90],
    ["302418", "Asadera de vidrio 23×15×7 cm", 5.60],
    ["923466", "Contenedores de vidrio herméticos Berlinger Haus", 41.00],
    ["261435", "Porta condimentos de cerámica 3 piezas con tapa de bambú", 21.45],
    ["261436", "Porta condimentos de cerámica 4 piezas con tapa de bambú", 16.70],
    ["Y10310", "Especiero giratorio de madera 8 piezas", 18.90],
    ["261462", "Aceitera y vinagrera con base de madera", 12.20],
    ["92031",  "Pinza multiuso de cocina inox", 1.60],
    ["93001",  "Espátula para fideos inox cepillado", 1.60],
    ["263383", "Juego de baño 6 piezas Reali", 100.00],
  ];
  const grid = document.getElementById("grid");
  grid.innerHTML = productos.map(([cod, nombre, precio]) => `
    <article class="card">
      <img src="img/${cod}.jpg?v=3" alt="${nombre}" loading="lazy" width="900" height="900">
      <h3>${nombre}</h3>
      <div class="meta">
        ${precio == null ? "" : `<span class="price">US$ ${precio.toFixed(2).replace(".", ",")}</span>`}
        <span class="code">CÓD. ${cod}</span>
      </div>
    </article>`).join("");
</script>
</body>
</html>
